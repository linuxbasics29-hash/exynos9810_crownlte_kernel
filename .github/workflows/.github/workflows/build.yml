name: Build Note9 Nethunter Kernel

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev clang lld gcc-aarch64-linux-gnu

      - name: Clone kernel
        run: |
          git clone https://github.com/${{ github.repository }} --depth=1 kernel
          cd kernel
          git log --oneline -5
          echo "Available defconfigs:"
          ls arch/arm64/configs/

      - name: Build
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          # Generate the base config FIRST
          make exynos9810-crownlte_defconfig

          # NOW apply our edits on top of it
          ./scripts/config --enable CONFIG_PACKET
          ./scripts/config --enable CONFIG_CFG80211
          ./scripts/config --enable CONFIG_MAC80211
          ./scripts/config --enable CONFIG_RFKILL
          ./scripts/config --enable CONFIG_BT
          ./scripts/config --enable CONFIG_BT_RFCOMM
          ./scripts/config --enable CONFIG_BT_HIDP
          ./scripts/config --enable CONFIG_BT_HCIUSB
          ./scripts/config --enable CONFIG_USB_NET_RNDIS_WLAN
          ./scripts/config --module CONFIG_RTL88XXAU
          ./scripts/config --module CONFIG_RTL88X2BU
          ./scripts/config --module CONFIG_ATH9K_HTC
          ./scripts/config --disable CONFIG_USB_F_CONN_GADGET

          # Resolve any new dependencies from our edits
          make olddefconfig

          make -j$(nproc) Image dtbs modules KCFLAGS="-Wno-error -Wno-array-bounds"

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: Note9-Nethunter-Kernel
          path: |
            kernel/arch/arm64/boot/Image
            kernel/arch/arm64/boot/dts/**/*.dtb
            kernel/**/*.ko
